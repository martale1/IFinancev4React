- id: AI_MB_MI
  enabled: true
  source: ai
  scope:
    tickers:
    - MB.MI
  when:
    all:
    - field: Close
      op: '>'
      value: 29.1
    - field: MACD_vs_Signal
      op: '>'
      value: 0
    - field: ADX
      op: '>='
      value: 25
    - field: Vol_Perc_vs_MA10
      op: '>'
      value: 0
  ai_conditions:
  - field: Close
    op: '>'
    value: 29.1
    description: Chiusura sopra la resistenza 29.1
  - field: MACD_vs_Signal
    op: '>'
    value: 0
    description: MACD sopra il segnale
  - field: ADX
    op: '>='
    value: 25
    description: ADX almeno pari a 25
  - field: Vol_Perc_vs_MA10
    op: '>'
    value: 0
    description: Volumi sopra la media mobile a 10 periodi
  cooldown_minutes: 0
  max_per_day: 3
  min_gap_minutes: 0
  message:
    title: 🤖 Alert AI MB.MI
    body: 'Tutte le condizioni AI sono verificate.

      Close: {{Close}}'
