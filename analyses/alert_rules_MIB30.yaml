version: 1
defaults:
  cooldown_minutes: 0
  send_on_first_match_only: true
  max_per_day: 3
  min_gap_minutes: 0
rules:
- id: CARD_ALERT_IG_MI
  enabled: true
  scope:
    tickers:
    - IG.MI
  when:
    all:
    - field: Close
      op: '>'
      value: 8
  cooldown_minutes: 0
  max_per_day: 3
  min_gap_minutes: 0
  message:
    title: 🔔 Alert {{Ticker}}
    body: 'Close: {{Close}}

      RSI: {{RSI}}

      willR: {{Williams_R}}

      SARMA: {{SIG_MA_SAR}}

      MACD: {{MACD}}

      S3: {{MACD_vs_Signal}}

      Action: {{Action}}

      TECH: {{TECH_SCORE}}

      Alligator: {{Signal6}}'
- id: CARD_ALERT_ENI_MI
