- id: AI_LEVEL_BMPS_MI_SUPPORT_11_3
  enabled: false
  source: ai_level
  scope:
    tickers:
    - BMPS.MI
  when:
    all:
    - field: Close
      op: <
      value: 11.3
  ai_level:
    type: support
    price: 11.3
    trigger: <
    description: Supporto inferiore visibile in area congestione recente
  cooldown_minutes: 0
  max_per_day: 3
  min_gap_minutes: 0
  message:
    title: 🤖 Supporto AI {Ticker}
    body: 'Supporto critico < 11.3.

      Close: {{Close}}'
