version: 1
defaults:
  cooldown_minutes: 0
  send_on_first_match_only: true
  max_per_day: 3
  min_gap_minutes: 0
rules:
- id: AI_FCT_MI
  enabled: true
  source: ai
  scope:
    tickers:
    - FCT.MI
  when:
    all:
    - field: MACD_vs_Signal
      op: '>'
      value: 0
    - field: RSI
      op: '>'
      value: 50
  ai_conditions:
  - field: MACD_vs_Signal
    op: '>'
    value: 0
    description: MACD sopra il segnale
  - field: RSI
    op: '>'
    value: 50
    description: RSI sopra 50
  cooldown_minutes: 0
  max_per_day: 3
  min_gap_minutes: 0
  message:
    title: 🤖 Alert AI FCT.MI
    body: 'Tutte le condizioni AI sono verificate.

      Close: {{Close}}'
