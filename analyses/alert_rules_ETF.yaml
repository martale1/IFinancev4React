version: 1
defaults:
  cooldown_minutes: 240
  send_on_first_match_only: true
  max_per_day: 3
  min_gap_minutes: 0
rules:
- id: AI_SOLR_MI
  enabled: true
  source: ai
  scope:
    tickers:
    - SOLR.MI
  when:
    all:
    - field: MACD_vs_Signal
      op: '>'
      value: 0
    - field: RSI
      op: '>'
      value: 50
  ai_conditions:
  - field: MACD_vs_Signal
    op: '>'
    value: 0
    description: MACD sopra il segnale
  - field: RSI
    op: '>'
    value: 50
    description: RSI sopra 50
  cooldown_minutes: 0
  max_per_day: 3
  min_gap_minutes: 0
  message:
    title: 🤖 Alert AI SOLR.MI
    body: 'Tutte le condizioni AI sono verificate.

      Close: {{Close}}'
- id: AI_LEVEL_SOLR_MI_RESISTANCE_21_0
  enabled: true
  source: ai_level
  scope:
    tickers:
    - SOLR.MI
  when:
    all:
    - field: Close
      op: '>'
      value: 21.0
  ai_level:
    type: resistance
    price: 21.0
    trigger: '>'
    description: Superamento della resistenza critica
  cooldown_minutes: 0
  max_per_day: 3
  min_gap_minutes: 0
  message:
    title: 🤖 Resistenza AI {Ticker}
    body: 'Resistenza critico > 21.0.

      Close: {{Close}}'
