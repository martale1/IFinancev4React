version: 1
defaults:
  cooldown_minutes: 240
  send_on_first_match_only: true
  max_per_day: 3
  min_gap_minutes: 0
rules:
- id: AI_LEVEL_LCFE_MI_RESISTANCE_2_5
  enabled: true
  source: ai_level
  scope:
    tickers:
    - LCFE.MI
  when:
    all:
    - field: Close
      op: '>'
      value: 2.5
  ai_level:
    type: resistance
    price: 2.5
    trigger: '>'
    description: Superamento della resistenza a 2.50
  cooldown_minutes: 0
  max_per_day: 3
  min_gap_minutes: 0
  message:
    title: 🤖 Resistenza AI {Ticker}
    body: 'Resistenza critico > 2.5.

      Close: {{Close}}'
- id: AI_LCFE_MI
  enabled: true
  source: ai
  scope:
    tickers:
    - LCFE.MI
  when:
    all:
    - field: MACD_vs_Signal
      op: '>'
      value: 0
    - field: RSI
      op: '>'
      value: 50
  ai_conditions:
  - field: MACD_vs_Signal
    op: '>'
    value: 0
    description: MACD sopra il segnale
  - field: RSI
    op: '>'
    value: 50
    description: RSI sopra 50
  cooldown_minutes: 0
  max_per_day: 3
  min_gap_minutes: 0
  message:
    title: 🤖 Alert AI LCFE.MI
    body: 'Tutte le condizioni AI sono verificate.

      Close: {{Close}}'
- id: CARD_ALERT_LSIL_MI
  enabled: true
  scope:
    tickers:
    - LSIL.MI
  when:
    all:
    - field: Stoch_KvsD
      op: '>'
      value: 0
  cooldown_minutes: 0
  max_per_day: 3
  min_gap_minutes: 0
  message:
    title: 🔔 Alert {{Ticker}}
    body: 'Close: {{Close}}

      RSI: {{RSI}}

      willR: {{Williams_R}}

      SARMA: {{SIG_MA_SAR}}

      MACD: {{MACD}}

      S3: {{MACD_vs_Signal}}

      Action: {{Action}}

      TECH: {{TECH_SCORE}}

      Alligator: {{Signal6}}'
